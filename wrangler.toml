name = "platenko"
main = "worker.js"
compatibility_date = "2026-11-23"

# Cloudflare D1 SQL Database binding
[[d1_databases]]
binding = "DB"
database_name = "platenko-db"
database_id = "e32573f5-4c97-48af-9b2b-31acaa3a2447"

# Cloudflare R2 Storage binding for images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "platenko-photos"

# Serve static assets (HTML, CSS, JS)
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/whatsnew.md"]

# Weekly Cron Trigger for refreshing expiring Meta / Aukro integration tokens (Monday 03:00 UTC)
[triggers]
crons = ["0 3 * * 1"]
